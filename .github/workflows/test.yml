name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    defaults:
      run:
        working-directory: ai-field-force/backend

    env:
      # Hermetic test environment — no real secrets needed
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      JWT_REFRESH_SECRET: ci-test-refresh-secret-do-not-use-in-prod
      DEV_MODE: "true"
      DATABASE_URL: "sqlite:///:memory:"
      # OpenAI / Resend not used in tests — leave empty so the factory
      # falls back to console / no-op
      OPENAI_API_KEY: ""
      RESEND_API_KEY: ""
      EMAIL_OTP_DEMO_REDIRECT: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ai-field-force/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Report
        if: always()
        run: echo "Tests completed for Python ${{ matrix.python-version }}"